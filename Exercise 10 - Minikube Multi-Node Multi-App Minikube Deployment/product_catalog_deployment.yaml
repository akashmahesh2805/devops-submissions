apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-catalog
  namespace: default
  labels:
    app: product-catalog
spec:
  replicas: 2
  selector:
    matchLabels:
      app: product-catalog
  template:
    metadata:
      labels:
        app: product-catalog
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: product-catalog
              topologyKey: "kubernetes.io/hostname"
      containers:
        - name: product-catalog
          image: product-catalog:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /products
              port: 80
            periodSeconds: 5
            timeoutSeconds: 2
